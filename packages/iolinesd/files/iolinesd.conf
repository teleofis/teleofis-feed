# iolinesd configuration.
#
# One section per line, the section name is the line name. A comment must
# occupy the whole line; '#' inside a value is not a comment.
#
#   source     file the value is read from (required)
#   poll       poll the line in the background, default 0
#   threshold  threshold in the units of scale (required when poll = 1)
#   hysteresis half-width of the band around the threshold, default 0
#   scale      multiplier, default 1.0
#   offset     addend, default 0
#   interval   poll period in ms, default 1000
#   precommand shell command run before every read of the source
#   command    shell command run on every crossing
#   edge       crossings that run command: both, rising, falling; default both
#   hotplug    call hotplug on crossings and switches, default 1
#   mode       adc, dry_contact or oc, default adc
#   enabled    mode after boot: 1 - mode, 0 - adc, default 0
#   oc_on      shell command that switches the open collector on
#   oc_off     shell command that switches the open collector off
#   dc_on      shell command that switches the dry contact pull-up on
#   dc_off     shell command that switches the dry contact pull-up off
#
# All commands run through /bin/sh with IO_NAME, IO_LINE and IO_PATH in the
# environment.
#
# State
# -----
#
# value = raw * scale + offset, rounded to an integer. A line goes above once
# the value rises over threshold + hysteresis and below once it drops under
# threshold - hysteresis; inside the band the state is kept. A first sample
# inside the band takes the side of the threshold: above if value >= threshold.
# -t does the same for a line with poll = 0, with no sample yet or without the
# daemon. The first sample after a start or a mode change only sets the state,
# without an event. A line in oc is an output: not polled, no state, no events.
#
# precommand runs before every read, e.g. to switch a multiplexer or power a
# sensor. The daemon waits for it and polls nothing else meanwhile, so it must
# be fast; a non-zero exit status skips the sample.
#
# Events
# ------
#
# Every crossing runs command; edge limits it to rising (going above) or
# falling (going below), the state is tracked both ways anyway. Unless
# hotplug = 0, it also runs /sbin/hotplug-call iolines, i.e. every script in
# /etc/hotplug.d/iolines/, in both directions, with ACTION = IO_EDGE. Another
# program subscribes by dropping a script there. Both get:
#
#   IO_NAME        section name
#   IO_LINE        section index, starting at 0
#   IO_PATH        source path
#   IO_EDGE        above or below
#   IO_EDGE_FILTER edge of the line, for hotplug scripts that need it
#   IO_MODE        adc or dry_contact
#   IO_VALUE       value after conversion
#   IO_RAW         value as read from the source
#   IO_THRESHOLD   threshold
#   IO_HYSTERESIS  hysteresis
#
#   #!/bin/sh
#   # /etc/hotplug.d/iolines/50-example
#   [ "$ACTION" = "above" ] && logger -t iolines "$IO_NAME: $IO_VALUE mV"
#
# A handler must finish within the poll interval: while the previous one of
# the line still runs, the next crossing is skipped and reported to syslog.
#
# Modes
# -----
#
#   adc          oc_off, dc_off
#   dry_contact  oc_off, dc_on
#   oc           dc_off, oc_on
#
# If the first command fails the second is not run, so the open collector and
# the pull-up are never on together. Failures go to syslog. Without any of the
# four commands a line has no mode switching and mode only affects the
# comparator; a line with only some of them is reported and left as it is.
#
# The first start after boot (no /var/run/iolinesd.boot yet) puts lines with
# enabled = 0 into adc and with enabled = 1 into their mode; later starts set
# the mode of every line. SIGHUP puts every line that is not in its mode into
# it and sets the mode again where the commands changed; a line switched by -l
# is left alone unless its mode or commands changed.
#
# Output control
# --------------
#
#   iolinesd -l name -a close|open|pulse [-d sec] [-s cloud|web|local] [-i id]
#
# A line is closed while it is in oc. close holds it closed, open returns it to
# its base mode (mode, or adc when mode = oc), pulse closes it for -d seconds,
# 1..3600, then opens it. -s is who switches, default local; -i is the command
# id. open cancels a running pulse. The pulse timer runs on the monotonic
# clock. Holds and pulses live in the daemon memory only: after a restart or a
# reboot the modes are set as described above.
#
# Exit status and the word on stdout, errors checked top-down:
#
#   0  ok              the line is switched
#   0  no_change       close on a closed line, open on an open one
#   0  already_closed  pulse on a closed line: no switch, the timer is started
#   1  no_line         no such line
#   1  bad_duration    pulse without a length in 1..3600
#   1  busy            close or pulse while a pulse runs
#   1  failed          a mode command failed or the line has none; the
#                      commands of the previous mode are run again
#   2                  wrong arguments, or the daemon is not running
#
# Unless hotplug = 0, every switch also runs hotplug with:
#
#   ACTION         closed - into oc, opened - out of oc,
#                  mode - from adc to dry_contact or back
#   IO_MODE        the new mode
#   IO_SOURCE      cloud, web or local from -s; timer for the end of a pulse
#                  started by cloud, local for one started by web or local;
#                  web for a change of the mode option read on SIGHUP
#   IO_COMMAND_ID  -i for cloud, -i of the pulse for timer; unset otherwise
#
# open during a pulse gives one opened from its sender, the pulse none. A
# failed switch, no_change, already_closed and the daemon start give no
# events. Switch events are never skipped: they wait in order for the running
# handler of the line, up to 16; more are dropped and reported to syslog.
#
# Daemon
# ------
#
# -t reports every line, -g name only that one. They ask the running daemon
# through /var/run/iolinesd.sock (root only, -c unused), which adds the current
# and the base mode of every line and, during a pulse, the seconds left rounded
# up. The state is the one of the comparator; a line in oc has none. A client
# silent for a second is dropped. Without the daemon -t and -g read the file
# given by -c and report no modes.
#
# The daemon keeps running even when nothing is polled. SIGHUP rereads this
# file; if it cannot be read, the previous configuration stays. A line under
# the same name keeps its state unless source, scale, offset, poll, threshold
# or hysteresis changed. On OpenWrt /etc/init.d/iolines generates this file
# from /etc/config/iolines and signals the daemon on reload.

#[global]
#interval  = 1000
#hotplug   = 1

